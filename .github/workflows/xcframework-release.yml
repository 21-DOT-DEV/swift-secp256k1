name: XCFramework Release
on:
  release:
    types: [published]
jobs:
  macos:
    name: Build XCFramework
    runs-on: xcode-27
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The xcode-27 label pins the image; DEVELOPER_DIR pins the 27.0
      # toolchain inside it so the release toolchain can't drift when the
      # image's default moves to a 27.x point release. Xcode 27's emitter
      # produces the P256K::P256K selector spelling natively, pinned via
      # -enable-module-selectors-in-module-interface (Release.xcconfig).
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable development dependencies
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: git tag -d "$TAG_NAME" 2>/dev/null || true
      - name: Generate Xcode project
        run: swift package --disable-sandbox tuist generate -p Projects/ --no-open
      - name: Archive & Create XCFramework
        run: |
            # Define workspace and scheme
            WORKSPACE='Projects/XCFramework.xcworkspace'
            SCHEME='P256K'
            CONFIGURATION='Release'
            ARCHIVE_DIR='Archives'

            # Platforms to archive
            PLATFORMS=(
              "iOS"
              "iOS Simulator"
              "macOS"
              "tvOS"
              "tvOS Simulator"
              "watchOS"
              "watchOS Simulator"
            # "visionOS"
            # "XR Simulator"
            )

            # Loop over platforms and archive for each one
            for PLATFORM in "${PLATFORMS[@]}"; do
              echo "Archiving for $PLATFORM..."

              # Run xcodebuild archive for each platform
              xcodebuild archive \
                -workspace "$WORKSPACE" \
                -scheme "$SCHEME" \
                -configuration "$CONFIGURATION" \
                -destination "generic/platform=$PLATFORM" \
                -archivePath "$ARCHIVE_DIR/P256K-$PLATFORM.xcarchive"

              # Check if archive command was successful
              if [ $? -eq 0 ]; then
                echo "$PLATFORM archive created successfully."
              else
                echo "Failed to archive for $PLATFORM. Exiting."
                exit 1
              fi
            done

            echo "All archives completed successfully."

            # Create an XCFramework to support multiple platforms and architectures
            # Each -archive parameter specifies a path to a .xcarchive built for a different platform
            # -framework specifies the framework within those archives to include in the XCFramework
            # The -output parameter specifies the name and location of the XCFramework to be created
            xcodebuild -create-xcframework \
              -archive "Archives/P256K-iOS.xcarchive" -framework P256K.framework \
              -archive "Archives/P256K-iOS Simulator.xcarchive" -framework P256K.framework \
              -archive "Archives/P256K-macOS.xcarchive" -framework P256K.framework \
              -archive "Archives/P256K-tvOS.xcarchive" -framework P256K.framework \
              -archive "Archives/P256K-tvOS Simulator.xcarchive" -framework P256K.framework \
              -archive "Archives/P256K-watchOS.xcarchive" -framework P256K.framework \
              -archive "Archives/P256K-watchOS Simulator.xcarchive" -framework P256K.framework \
              -output P256K.xcframework

            # Hand the archived platform list to the verify step — the
            # verifier consumer-builds exactly these destinations.
            printf '%s\n' "${PLATFORMS[@]}" > "$RUNNER_TEMP/xcf-platforms"
      - name: 7z XCFramework
        run: |
          # Copy each compiled-in upstream's license text to the current
          # directory to avoid including folder structure. The framework
          # compiles vendored libsecp256k1 and swift-crypto code, so both
          # licenses ship in the artifact; swift-crypto's NOTICE carries its
          # Apache-2.0 §4(d) attribution text.
          cp "Sources/libsecp256k1/COPYING" "COPYING-libsecp256k1"
          cp "Sources/P256K/swift-crypto/LICENSE.txt" "LICENSE-swift-crypto.txt"
          cp "Sources/P256K/swift-crypto/NOTICE.txt" "NOTICE-swift-crypto.txt"
          # Create zip with maximum compression including license files alongside the
          # XCFramework. -snl is load-bearing: the standalone 7-Zip port (7zz, since
          # 21.x) dereferences symlinks by default — Versions/Current → real dir,
          # binary duplicated — unless told to store links; legacy p7zip stored them
          # by default (why older release zips kept theirs). Materializing is
          # benign for a static framework — a fatter zip, identical linkage — but
          # -snl keeps the artifact byte-honest at zero cost.
          7z a -tzip -mx=9 -snl P256K.xcframework.zip P256K.xcframework LICENSE "COPYING-libsecp256k1" "LICENSE-swift-crypto.txt" "NOTICE-swift-crypto.txt"
      - name: Verify XCFramework
        run: |
          # Verify what actually ships: unzip the produced zip into a temp
          # dir and gate on the extracted copy — per-slice/per-arch export
          # allowlist (a leaked _secp256k1_* silently binds to a consumer's
          # own libsecp256k1 under -dead_strip, invisible to builds) plus a
          # real consumer build per shipped platform: `swift test` on
          # macOS and `xcodebuild build-for-testing` for every slice
          # destination (interface typechecking already happened at
          # archive emit via -verify-emitted-module-interface). Shared
          # with Bitrise (ARCHIVE step) so both verify the same thing.
          unzip -q P256K.xcframework.zip -d "$RUNNER_TEMP/xcf-verify"
          # License compliance gate: every compiled-in upstream ships its
          # license text (Apache-2.0 §4(a)/(d) for swift-crypto — LICENSE +
          # NOTICE attribution). All four must exist non-empty, and the
          # renamed copies must carry the vendored bytes verbatim — the
          # vendored tree is the source of truth, so a stale or empty copy
          # fails here rather than in a released artifact.
          for f in LICENSE COPYING-libsecp256k1 LICENSE-swift-crypto.txt NOTICE-swift-crypto.txt; do
            test -s "$RUNNER_TEMP/xcf-verify/$f" || { echo "license file missing or empty in zip: $f"; exit 1; }
          done
          cmp "$RUNNER_TEMP/xcf-verify/COPYING-libsecp256k1" "Sources/libsecp256k1/COPYING"
          cmp "$RUNNER_TEMP/xcf-verify/LICENSE-swift-crypto.txt" "Sources/P256K/swift-crypto/LICENSE.txt"
          cmp "$RUNNER_TEMP/xcf-verify/NOTICE-swift-crypto.txt" "Sources/P256K/swift-crypto/NOTICE.txt"
          # The archived platform list crosses steps via a file the archive
          # step wrote; read -d '' returns 1 at EOF, so `|| true` is load-
          # bearing. Direct call (not xargs) keeps the verifier's exit code.
          IFS=$'\n' read -r -d '' -a platforms < "$RUNNER_TEMP/xcf-platforms" || true
          bash Scripts/verify-p256k-xcframework.sh "$RUNNER_TEMP/xcf-verify/P256K.xcframework" "${platforms[@]}"
      - name: Upload XCFramework
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Re-runs converge on the asset that's already there: it is the
          # artifact the release serves, so leave it untouched rather than
          # clobbering (a failed --clobber leaves no asset at all). The
          # deploy step pins the podspec to the published asset's digest,
          # not this local copy, so whichever run uploaded it stays
          # consistent.
          [ "$(gh release view "$TAG_NAME" --json assets \
              --jq 'any(.assets[]; .name == "P256K.xcframework.zip")')" = true ] \
            && echo "::notice::P256K.xcframework.zip already on $TAG_NAME — skipping upload" \
            || gh release upload "$TAG_NAME" P256K.xcframework.zip
      - name: Deploy to Cocoapods
        run: |
          # Install Cocoapods
          gem install cocoapods

          # Pin the podspec to the artifact consumers actually download —
          # the published release asset's own digest — not this job's local
          # zip. A re-run's rebuild differs byte-wise, so a local hash could
          # make the spec point at bytes that were never uploaded.
          export XCFRAMEWORK_SHA=$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$POD_VERSION" \
              --jq '.assets[] | select(.name == "P256K.xcframework.zip") | .digest // empty' \
              | sed 's/^sha256://' || true
          )
          [[ "$XCFRAMEWORK_SHA" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::no usable P256K.xcframework.zip digest on the $POD_VERSION release"
            exit 1
          }
          
          # Validate the podspec using the environment variables set above
          # This checks that the podspec is valid before attempting to publish
          pod spec lint Projects/swift-secp256k1.podspec
          
          # Push the podspec to the CocoaPods Trunk service
          # This publishes the new version of the pod to the CocoaPods registry.
          # `pod trunk push` exit codes lie in both directions: the GitHub
          # commit API check that kills it can fire before trunk accepts the
          # spec (nothing lands — a retry can succeed) or after (the spec
          # landed — the "failure" is the post-publish verification). Trunk
          # rejects duplicates structurally, so retrying a possibly-landed
          # push is safe; probe server state between attempts and after.
          trunk_live() {
            curl -sfL --retry 3 --retry-delay 3 \
              "https://trunk.cocoapods.org/api/v1/pods/swift-secp256k1" \
              -o "$RUNNER_TEMP/trunk.json" \
              && jq -e --arg v "$POD_VERSION" \
                  'any(.versions[].name; . == $v)' "$RUNNER_TEMP/trunk.json" \
                  >/dev/null
          }
          for attempt in 1 2 3; do
            pod trunk push Projects/swift-secp256k1.podspec && exit 0
            sleep 30
            trunk_live && break
          done
          # Every push reported failure — but the spec may have landed anyway,
          # and the trunk API lags registration by seconds-to-minutes. Poll
          # before calling it a real miss.
          live=''
          for i in 1 2 3 4 5 6; do
            trunk_live && { live=1; break; }
            sleep 30
          done
          [ -n "$live" ] || {
            echo "::error::pod trunk push failed and $POD_VERSION did not appear on trunk"
            exit 1
          }
          # The version is live. Confirm the published spec pins the same
          # checksum as the release asset — a spec published by an earlier
          # run while the asset was replaced outside this workflow would
          # otherwise be blessed while installs fail integrity checks.
          # Fetch from the Specs git repo (the CDN mirrors it but caches for
          # hours), polling for propagation.
          published=''
          for i in 1 2 3; do
            curl -sfL --retry 3 --retry-delay 3 \
              "https://raw.githubusercontent.com/CocoaPods/Specs/master/Specs/7/b/2/swift-secp256k1/$POD_VERSION/swift-secp256k1.podspec.json" \
              -o "$RUNNER_TEMP/published.json" \
              && { published=1; break; }
            sleep 30
          done
          [ -n "$published" ] || {
            echo "::warning::$POD_VERSION is live on trunk but its published spec is not fetchable yet — sha256 unverified; a spec accepted moments ago can only carry the release asset's checksum"
            exit 0
          }
          jq -e --arg s "$XCFRAMEWORK_SHA" \
            '.source.sha256 == $s' "$RUNNER_TEMP/published.json" >/dev/null \
            || {
              echo "::error::$POD_VERSION is live but its published sha256 does not match the release asset's digest — the registry pins a stale spec"
              exit 1
            }
          echo "::notice::$POD_VERSION is live on CocoaPods trunk and matches the release asset's checksum — the push succeeded before a later call failed; treating as deployed"
          exit 0
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          # The tag that triggered this run — the same source the upload step
          # uses — so the podspec can't drift to a newer release published
          # mid-run (a "latest release" query can).
          POD_VERSION: ${{ github.ref_name }}